<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog &middot; Aditya Potnis</title>
<meta name="description" content="Blog by Aditya Potnis.">

<link rel="icon" type="image/x-icon" href="images/uiucfavicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="images/uiucfavicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f8fa;
    --ink: #16181c;
    --ink-soft: #393d44;
    --muted: #767c85;
    --rule: #e2e6ec;
    --accent: #16181c;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  :root[data-theme="dark"] {
    --bg: #0f1115;
    --ink: #e8eaed;
    --ink-soft: #c2c6cd;
    --muted: #8b929c;
    --rule: #2a2f38;
    --accent: #e8eaed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .app-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .sidebar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin: 0 -1.5rem;
    padding: 0.85rem 1.5rem;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .sidebar a.back {
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 500;
  }
  .sidebar a.back:hover { color: var(--accent); text-decoration: none; }

  .theme-toggle {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    width: 30px;
    height: 30px;
    border-radius: 999px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .theme-toggle svg { width: 16px; height: 16px; }
  .theme-toggle .sun { display: none; }
  .theme-toggle .moon { display: block; }
  :root[data-theme="dark"] .theme-toggle .sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .moon { display: none; }

  header.page-header {
    margin: 2.5rem 0 2rem;
  }
  h1.page-title {
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
    line-height: 1.1;
  }
  .page-subtitle {
    color: var(--ink-soft);
    margin: 0;
  }

  ul.post-list { list-style: none; padding: 0; margin: 0; }
  ul.post-list li {
    padding: 1rem 0;
    border-bottom: 1px solid var(--rule);
  }
  ul.post-list li:first-child { padding-top: 0; }
  ul.post-list a.post-title {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 600;
  }
  ul.post-list p {
    margin: 0.25rem 0 0;
    color: var(--ink-soft);
  }
</style>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
<div class="app-container">

  <aside class="sidebar">
    <a class="back" href="index.html">&larr; Aditya Potnis</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </aside>

  <main>
    <header class="page-header">
      <h1 class="page-title">Blog</h1>
      <p class="page-subtitle">Notes on things I'm learning and figuring out.</p>
    </header>

    <ul class="post-list">
      <li>
        <a class="post-title" href="https://app.notion.com/p/Math-terminology-3f4526e1d57180f78037f68e04a86c61?v=2fa526e1d571814b8924000c8a90c7de&amp;source=copy_link" target="_blank" rel="noopener">CS Math Terminology</a>
        <p>A running glossary of math terminology used in computer science.</p>
      </li>
    </ul>
  </main>
</div>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = dark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();
</script>
</body>
</html>
